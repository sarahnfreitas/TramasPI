<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRAMAS</title>
    <link rel="stylesheet" href="PrincipalEstilo.css">
</head>
<body>

    <header>
        <img src="TramasNormal.png" alt="TRAMAS" class="logo">
    </header>

    <main>
        <div class="map-container">

            <!-- 
                O SVG é carregado com <object> para que o JavaScript
                possa acessar os elementos internos (paths dos países).
                NÃO use <img> — com <img> o JS não consegue interagir.
            -->
            <object
                id="southAmericaMap"
                type="image/svg+xml"
                data="AmericaDoSul.svg"
                aria-label="Mapa interativo da América do Sul">
            </object>

        </div>

        <!-- Tooltip que aparece ao passar o mouse -->
        <div class="tooltip" id="tooltip">
            <span class="tooltip-pais" id="tooltipNome"></span>
            <span class="tooltip-capital" id="tooltipCapital"></span>
        </div>
    </main>

    <script src="Script.js"></script>

</body>
</html>
